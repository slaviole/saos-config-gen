components_by_slot:
  main_slot:
  - components:
    - layout_properties: {grid_position: 'LVROVZ,BCAJEG'}
      name: label_1
      properties: {role: input-prompt, text: 'IP Address:'}
      type: Label
    - layout_properties: {grid_position: 'LVROVZ,NFUNMS'}
      name: ip_address
      properties: {placeholder: Enter IP Address}
      type: TextBox
    - layout_properties: {grid_position: 'OVUSFQ,TKYHWP'}
      name: label_2
      properties:
        role: input-prompt
        text: |
          Subnet Mask:
      type: Label
    - layout_properties: {grid_position: 'OVUSFQ,SOQPWP'}
      name: subnet_mask
      properties: {placeholder: Enter Subnet Mask Size}
      type: TextBox
    - layout_properties: {grid_position: 'LLQLPP,XKUGKF'}
      name: label_3
      properties: {role: input-prompt, text: 'Default Gateway:'}
      type: Label
    - layout_properties: {grid_position: 'LLQLPP,RUNOFC'}
      name: default_gateway
      properties: {placeholder: Enter Default Gateway IP}
      type: TextBox
    - event_bindings: {click: submit_click}
      layout_properties: {grid_position: 'CVAAGW,LDKTLL'}
      name: submit
      properties: {role: outlined-button, text: Submit}
      type: Button
    layout_properties: {}
    name: outlined_card_1
    properties: {role: outlined-card}
    type: ColumnPanel
  - components:
    - layout_properties: {grid_position: 'RGECFU,PFAGFB'}
      name: output_text
      properties: {}
      type: Label
    - event_bindings: {click: copy_button_click}
      layout_properties: {grid_position: 'WFDJHK,ATDCAD'}
      name: copy_button
      properties:
        role: outlined-button
        text: |
          Copy to Clipboard
      type: Button
    layout_properties: {}
    name: output_card
    properties: {role: outlined-card, visible: false}
    type: ColumnPanel
is_package: true
layout: {type: 'form:Homepage'}
