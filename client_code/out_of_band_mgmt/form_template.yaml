components:
- components:
  - components:
    - layout_properties: {full_width_row: false, grid_position: 'FXMHCC,LFUOPW'}
      name: label_1
      properties: {icon_align: left, role: input-prompt, text: 'IP Address:'}
      type: Label
    - layout_properties: {grid_position: 'FXMHCC,PDNNIJ'}
      name: ip_address
      properties: {placeholder: Enter IP address here... (e.g. 192.168.1.54)}
      type: TextBox
    - layout_properties: {grid_position: 'XIGJRK,SPBUCD'}
      name: label_3
      properties: {role: input-prompt, text: 'Subnet Mask:'}
      type: Label
    - layout_properties: {grid_position: 'XIGJRK,UROWBY'}
      name: subnet_mask
      properties: {placeholder: Enter Mask here... (e.g. 24)}
      type: TextBox
    - layout_properties: {grid_position: 'SNIRGX,XSDTMX'}
      name: label_4
      properties: {role: input-prompt, text: 'Default Gateway:'}
      type: Label
    - layout_properties: {grid_position: 'SNIRGX,BOMMWZ'}
      name: default_gateway
      properties: {placeholder: Default Gateway...(e.g. 192.168.1.1)}
      type: TextBox
    - event_bindings: {click: submit_click}
      layout_properties: {grid_position: 'COULIU,ZADZJC'}
      name: submit
      properties: {background: '', role: outlined-button, text: Submit}
      type: Button
    layout_properties: {grid_position: 'RIQDIC,APAYUN'}
    name: outlined_card_1
    properties: {role: outlined-card}
    type: ColumnPanel
  - components:
    - layout_properties: {grid_position: 'KTQSUZ,CDWPVX'}
      name: label_5
      properties: {role: title, text: 'Output:'}
      type: Label
    - layout_properties: {grid_position: 'PZUIKZ,CYDYGP'}
      name: output_text
      properties: {font: Courrier New, font_size: 16, spacing_above: medium, spacing_below: medium}
      type: Label
    - event_bindings: {click: copy_button_click}
      layout_properties: {grid_position: 'XCOREE,BGJSEN'}
      name: copy_button
      properties:
        role: outlined-button
        text: |
          Copy to Clipboard
      type: Button
    layout_properties: {grid_position: 'GMGRTX,DOGNGR'}
    name: output_card
    properties: {role: outlined-card, visible: false}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
  properties: {col_widths: '{}'}
  type: ColumnPanel
- layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
- layout_properties: {slot: left-nav}
  name: column_panel_1
  properties: {}
  type: ColumnPanel
container:
  properties: {background: '', html: '@theme:standard-page.html', visible: true}
  type: HtmlTemplate
is_package: true
